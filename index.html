<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wedding Gallery</title>
<link rel="stylesheet" href="css/gallery.css">
<style>
@font-face{
font-family:"Mongmong";
src:url("https://fastly.jsdelivr.net/gh/projectnoonnu/noonfonts_2301@1.1/Ownglyph_Mongmongday.woff") format("woff");

<body>
<section class="gallery">
<p class="guide">사진을 클릭하시면 전체 화면 보기가 가능합니다</p>
