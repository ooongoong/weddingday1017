<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>weddingday1017</title>

    <link rel="stylesheet" href="./css/style.css">
</head>

<body>

<section class="account-section">
    <div class="account-container">

        <div class="account-card">
            <div class="account-left">
                <span class="label">신랑측</span>
                <strong>홍길동</strong>
            </div>

            <div class="divider"></div>

            <div class="account-right">
                <span class="account-number">신한은행 110-123-456789</span>

                <button class="copy-btn" data-copy="110-123-456789">
                    📋 복사하기
                </button>
            </div>
        </div>

        <div class="account-card">
            <div class="account-left">
                <span class="label">신부측</span>
                <strong>김신부</strong>
            </div>

            <div class="divider"></div>

            <div class="account-right">
                <span class="account-number">국민은행 220-987-654321</span>

                <button class="copy-btn" data-copy="220-987-654321">
                    📋 복사하기
                </button>
            </div>
        </div>

    </div>

    <div id="toast">계좌번호가 복사되었습니다.</div>
</section>

<script src="./js/main.js"></script>

</body>
</html>
